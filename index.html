<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a9fd8">
<title>إعدادية الناصرية للبنين</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--sky:#2a9fd8;--sky2:#d9f0fb;--bg:#f4fbff;--card:#fff;--tx:#0f2c3d;--mut:#5b7a8c;--bd:#cfe8f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1a23;--card:#13293a;--tx:#e8f6fd;--mut:#8fb3c6;--bd:#21435a;--sky2:#17394f}}
:root[data-theme="dark"]{--bg:#0c1a23;--card:#13293a;--tx:#e8f6fd;--mut:#8fb3c6;--bd:#21435a;--sky2:#17394f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,sans-serif;min-height:100vh}
/* شاشة البداية */
#load{position:fixed;inset:0;z-index:99;background:linear-gradient(#fff,#d9f0fb);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .8s;color:#0f2c3d;overflow:hidden}
#load.off{opacity:0;pointer-events:none}
.lw{position:relative;width:150px;height:150px;display:flex;align-items:center;justify-content:center;animation:pop 1s cubic-bezier(.2,1.4,.4,1) both}
.lw:before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(#2a9fd8,#fff,#6cc6ee,#fff,#2a9fd8);animation:spin 2.4s linear infinite;-webkit-mask:radial-gradient(circle,transparent 62%,#000 64%);mask:radial-gradient(circle,transparent 62%,#000 64%)}
.lw img{width:124px;height:124px;border-radius:50%;object-fit:cover;box-shadow:0 6px 24px #2a9fd855;animation:breath 2.6s ease-in-out infinite}
#load text{font-family:'Amiri Quran',serif;font-size:56px;fill:transparent;stroke:#1d7fb0;stroke-width:1.2;stroke-dasharray:900;stroke-dashoffset:900;animation:dr 3.4s ease forwards,fl 1s 3s forwards}
.bub{position:absolute;bottom:-40px;border-radius:50%;background:#2a9fd822;animation:rise linear infinite}
@keyframes dr{to{stroke-dashoffset:0}}@keyframes fl{to{fill:#1d7fb0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(.3) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
@keyframes breath{50%{transform:scale(1.05)}}
@keyframes rise{to{transform:translateY(-110vh)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes shine{0%{background-position:0 50%}100%{background-position:200% 50%}}
@keyframes flash{0%{box-shadow:0 0 0 0 #2a9fd8aa}100%{box-shadow:0 0 0 14px #2a9fd800}}
.top{background:linear-gradient(110deg,#2a9fd8,#6cc6ee,#2a9fd8);background-size:200% 100%;animation:shine 7s linear infinite;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}
.top img.lg{width:46px;height:46px;border-radius:50%;border:2px solid #fff;object-fit:cover;background:#fff}
.top h1{font-size:16px;margin:0;flex:1}.top small{display:block;font-weight:400;opacity:.9;font-size:12px}
.flag{width:38px;height:26px;border-radius:3px;box-shadow:0 0 0 1px #fff8;transform-origin:right center;animation:wave 3s ease-in-out infinite}
@keyframes wave{50%{transform:skewY(-4deg) scaleX(.97)}}
main{max-width:720px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;animation:up .45s both;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px #2a9fd822}
.card:nth-child(2){animation-delay:.07s}.card:nth-child(3){animation-delay:.14s}.card:nth-child(4){animation-delay:.21s}.card:nth-child(n+5){animation-delay:.28s}
.card.new{animation:up .45s both,flash 1.4s 2}
input,select,textarea{width:100%;font:inherit;padding:10px;margin:5px 0 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--sky);box-shadow:0 0 0 3px #2a9fd833}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:var(--sky);color:#fff;font-weight:700;transition:transform .15s,filter .15s}
button:active{transform:scale(.95)}button:hover{filter:brightness(1.08)}button:disabled{opacity:.5}
button.g{background:var(--sky2);color:var(--tx)}button.r{background:#d64545}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}.tabs button{background:var(--sky2);color:var(--tx);white-space:nowrap}.tabs button.on{background:var(--sky);color:#fff}
.row{display:flex;gap:8px}.row>*{flex:1}
.mut{color:var(--mut);font-size:13px}.tag{display:inline-block;background:var(--sky2);border-radius:20px;padding:2px 10px;font-size:12px;margin-inline-end:4px}
.pr{display:flex;align-items:center;gap:10px}.pr img{width:56px;height:56px;border-radius:50%;border:2px solid var(--sky);object-fit:cover}
.num{font-size:26px;font-weight:700;color:var(--sky)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:start}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#0f2c3d;color:#fff;padding:8px 16px;border-radius:20px;display:none;z-index:120;animation:up .3s}
.pi{display:block;width:100%;max-height:420px;object-fit:contain;background:var(--bg);border-radius:10px;margin-top:8px;cursor:zoom-in}
.pv{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.pv div{position:relative}.pv img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--bd)}
.pv button{position:absolute;top:-6px;inset-inline-start:-6px;padding:0;width:24px;height:24px;border-radius:50%;background:#d64545}
#zm{position:fixed;inset:0;background:#000d;z-index:110;display:none;align-items:center;justify-content:center}
#zm img{max-width:100%;max-height:100%;object-fit:contain}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.guestc{text-align:center;background:linear-gradient(135deg,var(--sky2),var(--card))}
.gh{font-weight:700;font-size:16px}
.gb{width:100%;font-size:16px;padding:13px;background:linear-gradient(110deg,#1d7fb0,#2a9fd8,#6cc6ee,#2a9fd8);background-size:200% 100%;animation:shine 4s linear infinite,flash 2s infinite}
.hero{position:relative;overflow:hidden;text-align:center;color:#fff;padding:30px 16px 70px;background:linear-gradient(165deg,#176f9e,#2a9fd8 55%,#7ccdf0)}
.hero .bub{background:#ffffff30;bottom:-60px;z-index:0}
.hero>*:not(.bub):not(.wv){position:relative;z-index:1}
.hero .lw{margin:0 auto 10px}
.ht{margin:6px 0 2px;font-family:'Amiri Quran',serif;font-size:34px;animation:up .8s .3s both}
.hs{opacity:.92;font-size:14px;animation:up .8s .5s both}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px;animation:up .8s .7s both}
.chips span{background:#ffffff26;border:1px solid #ffffff55;border-radius:20px;padding:5px 14px;font-size:13px;backdrop-filter:blur(4px)}
.wv{position:absolute!important;bottom:-1px;left:0;width:100%;height:46px;display:block}
.gm{max-width:720px;margin:0 auto;padding:0 14px 30px}
.sec{margin-bottom:22px}
.rv{opacity:0;transform:translateY(26px);transition:opacity .8s,transform .8s}.rv.in{opacity:1;transform:none}
.st{font-size:20px;margin:0 0 10px;position:relative;padding-bottom:8px}
.st:after{content:"";position:absolute;bottom:0;inset-inline-start:0;height:3px;width:0;border-radius:3px;background:linear-gradient(90deg,var(--sky),#6cc6ee);transition:width 1s .3s}
.rv.in .st:after{width:64px}
.card p{margin:0 0 10px;line-height:1.9}
.facts{margin-top:6px}.facts .num{font-size:28px}
.big{align-items:flex-start}.big img{width:84px;height:84px}
.ring{position:relative;flex:none;width:96px;height:96px;display:flex;align-items:center;justify-content:center}
.ring:before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(#2a9fd8,#fff,#6cc6ee,#fff,#2a9fd8);animation:spin 3s linear infinite;-webkit-mask:radial-gradient(circle,transparent 66%,#000 68%);mask:radial-gradient(circle,transparent 66%,#000 68%)}
.ring img{border:0;width:82px;height:82px;animation:breath 3s ease-in-out infinite}
.ph{margin:0 0 12px;overflow:hidden;border-radius:14px;border:1px solid var(--bd);background:var(--card)}
.ph img{display:block;width:100%;height:auto;cursor:zoom-in;transition:transform .6s}.ph:hover img{transform:scale(1.03)}
.ph figcaption{padding:8px 12px;font-size:13px;color:var(--mut)}
.msg{border-inline-start:4px solid var(--sky)}
.vals{display:flex;flex-wrap:wrap;gap:6px}.vals span{background:var(--sky2);border-radius:20px;padding:4px 14px;font-size:13px;animation:pop 1s both}
.ex{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.exc{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;transition:transform .25s,box-shadow .25s}
.exc:hover{transform:translateY(-3px);box-shadow:0 8px 20px #2a9fd833}
.exc:last-child:nth-child(odd){grid-column:1/-1}
.bd{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--sky);color:#fff;align-items:center;justify-content:center;font-weight:700;margin-bottom:6px}
.exc b{display:block;margin-bottom:2px}
.sl{position:relative;aspect-ratio:1125/790;border-radius:14px;overflow:hidden;background:#0c1a23;cursor:zoom-in}
.sl .s{position:absolute;inset:0;opacity:0;transition:opacity 1s}.sl .s.on{opacity:1}
.sl .s img{width:100%;height:100%;object-fit:cover;transform:scale(1)}.sl .s.on img{animation:kb 6s ease-out both}
.sl .cp{position:absolute;inset-inline:0;bottom:0;padding:26px 12px 26px;color:#fff;font-size:13px;background:linear-gradient(transparent,#000a)}
.dots{position:absolute;bottom:8px;inset-inline:0;display:flex;justify-content:center;gap:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:#fff6;transition:all .3s}.dots i.on{background:#fff;width:22px;border-radius:6px}
.ul{margin:0;padding-inline-start:20px;line-height:2}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.08)}}
</style></head><body>

<script>
const firebaseConfig={apiKey:"AIzaSyCGMee4-HWJEOf6hW5SxwRf_LThAdJ33n8",authDomain:"nasr-483c1.firebaseapp.com",databaseURL:"https://nasr-483c1-default-rtdb.firebaseio.com",projectId:"nasr-483c1",storageBucket:"nasr-483c1.firebasestorage.app",messagingSenderId:"837009592807",appId:"1:837009592807:web:9071dbe6a197c425e32d42",measurementId:"G-8TMZW4MH33"};
const DB=firebaseConfig.databaseURL;
const hideLoad=()=>{const l=document.getElementById('load');if(l)l.classList.add('off')};
setTimeout(hideLoad,4600);
window.addEventListener('error',()=>setTimeout(hideLoad,300)); /* لا تبقى شاشة البداية عالقة أبداً */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FLAG='<svg class="flag" viewBox="0 0 30 20"><rect width="30" height="7" fill="#ce1126"/><rect y="7" width="30" height="6" fill="#fff"/><rect y="13" width="30" height="7" fill="#000"/><text x="15" y="12.2" text-anchor="middle" font-size="5" fill="#007a3d" font-family="Amiri Quran,serif">الله أكبر</text></svg>';
const GR={g4:'الرابع الإعدادي',g5:'الخامس الإعدادي',g6:'السادس الإعدادي'},SEC=['أ','ب','ج','د','هـ','و'];
const AUD={all:'الجميع',students:'كل الطلاب',teachers:'المدرسين فقط',g4:'الرابع',g5:'الخامس',g6:'السادس'};
const MAXIMG=190000,MAXIMGS=4;
let S={users:{},posts:{},reads:{},logins:{}},IM={},me=null,tab='post',lrole='student',busy={},seen0=false,lastSig='';
let D={t:'',b:'',a:'all'},PIMGS=[],publishing=false;
const ls={get(k){try{return JSON.parse(localStorage.getItem('nas_'+k)||'{}')}catch(e){return{}}},set(k,v){try{localStorage.setItem('nas_'+k,JSON.stringify(v));return true}catch(e){return false}}};
const hash=s=>{let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return h.toString(36)};
async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('nas27|'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return 'h'+hash('nas27|'+s)}}
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2800)};
const nrm=s=>s.replace(/\s+/g,' ').trim();
const today=()=>new Date().toDateString();
const dayKey=()=>today().replace(/\s/g,'');
/* ---- اتصال قاعدة البيانات (Realtime Database عبر REST) ---- */
async function api(m,p,b){const r=await fetch(DB+p+'.json',{method:m,headers:b!==undefined?{'Content-Type':'application/json'}:undefined,body:b!==undefined?JSON.stringify(b):undefined});if(!r.ok)throw new Error(r.status);return r.json()}
/* ---- حفظ الدخول للأبد إلى أن يضغط خروج ---- */
function saveMe(u){const j=JSON.stringify(u);try{localStorage.setItem('nas_me',j)}catch(e){}try{document.cookie='nas_me='+encodeURIComponent(j)+';max-age=315360000;path=/;SameSite=Lax'}catch(e){}try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}
function loadMe(){try{const m=localStorage.getItem('nas_me');if(m)return JSON.parse(m)}catch(e){}try{const c=document.cookie.split('; ').find(x=>x.indexOf('nas_me=')===0);if(c)return JSON.parse(decodeURIComponent(c.slice(7)))}catch(e){}return null}
function clearMe(){try{localStorage.removeItem('nas_me')}catch(e){}try{document.cookie='nas_me=;max-age=0;path=/'}catch(e){}}
me=loadMe();if(me)saveMe(me);

async function put(c,id,d){S[c][id]=d;render();try{await api('PUT','/'+c+'/'+id,d);return true}catch(e){if(c==='posts'||c==='users'){toast('تعذر الحفظ: تأكد من الاتصال وقواعد قاعدة البيانات');if(c==='posts')delete S.posts[id];render()}return false}}
async function del(c,id){delete S[c][id];render();try{await api('DELETE','/'+c+'/'+id);if(c==='posts')await api('DELETE','/imgs/'+id)}catch(e){toast('تعذر الحذف')}}
const visible=p=>me.role==='teacher'?['all','teachers'].includes(p.aud):['all','students',me.gr].includes(p.aud);
async function poll(){if(document.hidden||(me&&me.role==='guest'))return;
 try{const adm=me&&me.role==='admin',cols=adm?['posts','users','reads','logins']:['posts'];
  const res=await Promise.all(cols.map(c=>api('GET','/'+c)));
  const n={users:{},posts:{},reads:{},logins:{}};cols.forEach((c,i)=>n[c]=res[i]||{});
  if(!adm)Object.keys(S).forEach(c=>{if(c!=='posts')n[c]=S[c]});
  const sig=JSON.stringify(n);if(sig===lastSig)return;lastSig=sig;
  if(seen0&&me&&!adm){const fresh=Object.entries(n.posts).filter(([id,p])=>!S.posts[id]&&visible(p));if(fresh.length){toast('وصلك تبليغ جديد من الإدارة');fresh.forEach(x=>NEW[x[0]]=1)}}
  seen0=true;S=n;ls.set('pc',S.posts);render()}catch(e){}}
const NEW={};
function dayLog(){if(!me||me.role==='admin'||me.role==='guest')return;const k=today()+me.id;try{if(sessionStorage.getItem('nas_dl')===k)return;sessionStorage.setItem('nas_dl',k)}catch(e){}

function shrink(file){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(file);
 im.onload=()=>{URL.revokeObjectURL(u);let m=1000,q=.72,out='';
  for(let i=0;i<10;i++){const r=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*r));c.height=Math.max(1,Math.round(im.height*r));
   const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
   out=c.toDataURL('image/jpeg',q);if(out.length<=MAXIMG)break;q=Math.max(.35,q-.08);m=Math.round(m*.85)}
  out.length<=MAXIMG?ok(out):no()};
 im.onerror=()=>{URL.revokeObjectURL(u);no()};im.src=u})}

 document.querySelectorAll('.hero [data-n]').forEach(cnt);
 const els=[...document.querySelectorAll('.rv')];
 if(!('IntersectionObserver' in window)){els.forEach(e=>{e.classList.add('in');e.querySelectorAll('[data-n]').forEach(cnt)});}
 else{const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');e.target.querySelectorAll('[data-n]').forEach(cnt);io.unobserve(e.target)}}),{threshold:.12});els.forEach(e=>io.observe(e))}
 slT=setInterval(()=>{if(!me||me.role!=='guest'){clearInterval(slT);return}slGo(slI+1)},4000)}
